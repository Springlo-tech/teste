<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão AR - Personalizado</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <!-- Animation Mixer -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #333;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
    }

    #start-button {
      padding: 15px 30px;
      background-color: #007bff;
      color: white;
      font-size: 1.1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }

    #start-button:active {
      transform: scale(0.97);
    }

    #logo-cliente {
      width: 320px;
      max-height: 320px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    #minha-cena {
      display: none;
    }

    /* Botão de Som Flutuante */
    #sound-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1000;
      display: none; /* Só aparece quando a cena iniciar */
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.2s;
    }

    #sound-toggle-btn:active {
      transform: scale(0.90);
    }

    #sound-toggle-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>

<body>

  <!-- ========================================================= -->
  <!-- TELA INICIAL -->
  <!-- ========================================================= -->
  <div id="splash-screen">
    <img id="logo-cliente" src="assets/imagens/logo-A.webp" alt="Logo Personalizado">
    <h2 id="titulo-cliente">Coleção Halloween</h2>
    <p>Toque para iniciar a câmera e ativar o som</p>
    <button id="start-button">Iniciar</button>
  </div>

  <!-- ========================================================= -->
  <!-- BOTÃO DE SOM (FLUTUANTE) -->
  <!-- ========================================================= -->
  <button id="sound-toggle-btn" aria-label="Ativar/Desativar Som">
    <!-- Ícone Som Ligado (Padrão inicial) -->
    <svg id="icon-sound-on" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <!-- Ícone Som Desligado (Oculto inicialmente) -->
    <svg id="icon-sound-off" viewBox="0 0 24 24" style="display: none;">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C22.63 14.85 23 13.48 23 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
  </button>

  <!-- ========================================================= -->
  <!-- CENA AR -->
  <!-- ========================================================= -->
  <a-scene id="minha-cena" mindar-image="
      imageTargetSrc: markers/target.mind;
      maxTrack: 1;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
    " gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.4.1/" color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: false;" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-light type="ambient" color="#FFFFFF" intensity="1.2"></a-light>

    <!-- ======================================================= -->
    <!-- ASSETS -->
    <!-- ======================================================= -->
    <a-assets timeout="10000">
      <!-- Imagens -->
      <img id="fundo" src="assets/imagens/fundo.png" crossorigin="anonymous">
      
      <!-- Modelos 3D na pasta assets/modelos -->
      <a-asset-item id="modeloAbobora" src="assets/modelos/abobora.glb"></a-asset-item>
      
    </a-assets>

    <!-- CÂMERA -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ======================================================= -->
    <!-- TARGET A (Index 0) -->
    <!-- ======================================================= -->
    <a-entity mindar-image-target="targetIndex: 0" id="targetA">
     
      <a-gltf-model id="modelo-0" src="#modeloAbobora" scale="1.2 1.2 1.2" position="0 0 0.10" rotation="0 0 0" visible="false"
        animation-mixer="clip: *; loop: repeat; timeScale: 0;">
      </a-gltf-model>

    </a-entity>

   

  </a-scene>

  <!-- ========================================================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================================================= -->
  <script>
    // SPLASH / CÂMERA
    const splash = document.getElementById('splash-screen');
    const startBtn = document.getElementById('start-button');
    const scene = document.getElementById('minha-cena');
    const soundToggleBtn = document.getElementById('sound-toggle-btn');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    // MÚSICA ÚNICA
    const musicaFundo = new Audio('assets/musicas/halloween.mp3');
    musicaFundo.loop = true;
    musicaFundo.preload = 'auto';

    // Controle de estado do som pelo usuário
    let somMutadoPeloUsuario = false;

    startBtn.addEventListener('click', () => {
      splash.style.display = 'none';
      scene.style.display = 'block';
      soundToggleBtn.style.display = 'flex'; // Exibe o botão de som ao iniciar
    });

    // Lógica do botão de som
    soundToggleBtn.addEventListener('click', () => {
      somMutadoPeloUsuario = !somMutadoPeloUsuario;

      if (somMutadoPeloUsuario) {
        musicaFundo.pause();
        iconSoundOn.style.display = 'none';
        iconSoundOff.style.display = 'block';
      } else {
        iconSoundOn.style.display = 'block';
        iconSoundOff.style.display = 'none';
        // Se houver algum target ativo no momento, retoma a música
        const algumTargetAtivo = targets.some(item => {
          const t = document.querySelector(item.targetId);
          return t && t.object3D.visible;
        });
        if (algumTargetAtivo) {
          musicaFundo.play().catch(err => console.log('Erro ao retomar áudio:', err));
        }
      }
    });

    // DEBUG DOS MODELOS
    function debugModelo(modelo, nome) {
      if (!modelo) return;
      modelo.addEventListener('model-loaded', () => {
        console.log('MODELO CARREGADO:', nome);
      });
      modelo.addEventListener('model-error', (event) => {
        console.error('ERRO AO CARREGAR MODELO:', nome, event);
      });
    }

    debugModelo(document.querySelector('#modelo-0'), 'modelo-0');
   

    // =========================================================
    // GERENCIAMENTO DE TARGETS
    // =========================================================

    const targets = [
      { targetId: '#targetA', modeloId: '#modelo-0' }
    ];

    function esconderTodosModelos() {
      targets.forEach(item => {
        const modelo = document.querySelector(item.modeloId);
        if (modelo) {
          modelo.setAttribute('visible', 'false');
          modelo.setAttribute('animation-mixer', 'timeScale', 0);
        }
      });
    }

    targets.forEach(item => {
      const target = document.querySelector(item.targetId);
      const modelo = document.querySelector(item.modeloId);

      if (!target || !modelo) return;

      target.addEventListener('targetFound', () => {
        console.log('TARGET ENCONTRADO:', item.targetId);
        esconderTodosModelos();

        requestAnimationFrame(() => {
          modelo.setAttribute('visible', 'true');
          modelo.setAttribute('animation-mixer', 'timeScale', 1);
          
          // Toca a música apenas se o usuário não tiver mutado manualmente
          if (!somMutadoPeloUsuario) {
            musicaFundo.play().catch(error => {
              console.log('Áudio bloqueado:', error);
            });
          }
        });
      });

      target.addEventListener('targetLost', () => {
        console.log('TARGET PERDIDO:', item.targetId);
        modelo.setAttribute('visible', 'false');
        modelo.setAttribute('animation-mixer', 'timeScale', 0);
        
        musicaFundo.pause();
        musicaFundo.currentTime = 0;
      });
    });
  </script>

</body>

</html>
