<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartão AR - Personalizado</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.0/dist/mindar-image-aframe.prod.js"></script>

  <!-- Animation Mixer -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #333;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-align: center;
    }

    #start-button {
      padding: 15px 30px;
      background-color: #007bff;
      color: white;
      font-size: 1.1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }

    #start-button:active {
      transform: scale(0.97);
    }

    #logo-cliente {
      width: 320px;
      max-height: 320px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    #minha-cena {
      display: none;
    }
  </style>
</head>

<body>

  <!-- ========================================================= -->
  <!-- TELA INICIAL -->
  <!-- ========================================================= -->
  <div id="splash-screen">
    <img id="logo-cliente" src="assets/imagens/dragao.webp" alt="Logo Personalizado">
    <h2 id="titulo-cliente">Realidade Aumentada</h2>
    <p>Toque para iniciar a câmera</p>
    <button id="start-button">Iniciar</button>
  </div>

  <!-- ========================================================= -->
  <!-- CENA AR -->
  <!-- ========================================================= -->
  <a-scene id="minha-cena" mindar-image="
      imageTargetSrc: markers/target.mind;
      maxTrack: 1;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
    " gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.4.1/" color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: false;" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-light type="ambient" color="#FFFFFF" intensity="1.2"></a-light>

    <!-- ======================================================= -->
    <!-- ASSETS -->
    <!-- ======================================================= -->
    <a-assets timeout="10000">
      <!-- Modelos 3D na pasta assets/modelos -->
      <a-asset-item id="modeloLivro" src="assets/modelos/livro.glb"></a-asset-item>
    </a-assets>

    <!-- CÂMERA ------>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- ======================================================= -->
    <!-- TARGET A (Index 0) -->
    <!-- ======================================================= -->
    <a-entity mindar-image-target="targetIndex: 0" id="targetA">
      <a-gltf-model id="modelo-0" src="#modeloLivro" scale="0.8 .8 .8" position="0 0 0.40" rotation="0 0 0" visible="false"
        animation-mixer="clip: *; loop: repeat; timeScale: 0;">
      </a-gltf-model>
    </a-entity>

  </a-scene>

  <!-- ========================================================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================================================= -->
  <script>
    // SPLASH / CÂMERA
    const splash = document.getElementById('splash-screen');
    const startBtn = document.getElementById('start-button');
    const scene = document.getElementById('minha-cena');

    startBtn.addEventListener('click', () => {
      splash.style.display = 'none';
      scene.style.display = 'block';
    });

    // DEBUG DOS MODELOS
    function debugModelo(modelo, nome) {
      if (!modelo) return;
      modelo.addEventListener('model-loaded', () => {
        console.log('MODELO CARREGADO:', nome);
      });
      modelo.addEventListener('model-error', (event) => {
        console.error('ERRO AO CARREGAR MODELO:', nome, event);
      });
    }

    debugModelo(document.querySelector('#modelo-0'), 'modelo-0');

    // =========================================================
    // GERENCIAMENTO DE TARGETS
    // =========================================================

    const targets = [
      { targetId: '#targetA', modeloId: '#modelo-0' }
    ];

    function esconderTodosModelos() {
      targets.forEach(item => {
        const modelo = document.querySelector(item.modeloId);
        if (modelo) {
          modelo.setAttribute('visible', 'false');
          modelo.setAttribute('animation-mixer', 'timeScale', 0);
        }
      });
    }

    targets.forEach(item => {
      const target = document.querySelector(item.targetId);
      const modelo = document.querySelector(item.modeloId);

      if (!target || !modelo) return;

      target.addEventListener('targetFound', () => {
        console.log('TARGET ENCONTRADO:', item.targetId);
        esconderTodosModelos();

        requestAnimationFrame(() => {
          modelo.setAttribute('visible', 'true');
          modelo.setAttribute('animation-mixer', 'timeScale', 1);
        });
      });

      target.addEventListener('targetLost', () => {
        console.log('TARGET PERDIDO:', item.targetId);
        modelo.setAttribute('visible', 'false');
        modelo.setAttribute('animation-mixer', 'timeScale', 0);
      });
    });
  </script>

</body>

</html>
